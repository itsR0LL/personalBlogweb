services:
  personalblogweb:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: personalblogweb:local
    container_name: personalblogweb
    restart: unless-stopped
    env_file:
      - /srv/personalblogweb/shared/.env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_COMMIT: ${APP_COMMIT:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
      PERSONALBLOG_CONTENT_DIR: /srv/personalblogweb/shared/content/current
      COMMENTS_SERVICE_URL: http://comments:8080
    volumes:
      - /srv/personalblogweb/shared/content:/srv/personalblogweb/shared/content:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      comments:
        condition: service_healthy
    networks:
      - personalblogweb_net

  comments:
    build:
      context: ..
      dockerfile: services/comments/Dockerfile
    image: personalblog-comments:local
    container_name: personalblog-comments
    restart: unless-stopped
    env_file:
      - /srv/personalblogweb/shared/.env.production
    environment:
      COMMENTS_DATA_DIR: /data
    volumes:
      - /srv/personalblogweb/shared/comments:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - personalblogweb_net

networks:
  personalblogweb_net:
    external: true
